name: native-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local compiler
        run: python scripts/bootstrap.py
      - name: Validate
        env:
          MOON_HOME: ${{ github.workspace }}/.tooling/moon
        run: python scripts/validate.py --clean-room
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            artifacts/*.log
            artifacts/validation-failure.json
            docs/validation-results.json
