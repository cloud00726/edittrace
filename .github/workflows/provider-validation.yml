name: Provider host validation
on:
  push:
    paths:
      - '.github/workflows/provider-validation.yml'
      - 'extensions/vscode/**'
      - 'core/**'
      - 'io/**'
      - 'cmd/**'
      - 'moon.mod'
      - 'scripts/run_provider_regression.py'
      - 'scripts/draft_provider_suite.py'
      - 'scripts/test_provider_runner.py'
      - 'scripts/check_provider_evidence.py'
      - 'scripts/bootstrap.py'
      - 'scripts/native_artifact.py'
      - 'toolchain.json'
      - 'examples/provider-consumer/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p test_provider_runner.py -v
      - run: python scripts/bootstrap.py
      - name: Build core and fixture VSIXs
        shell: pwsh
        run: |
          $env:MOON_HOME = (Resolve-Path .tooling/moon).Path
          $moon = if ($IsWindows) { '.tooling/moon/bin/moon.exe' } else { '.tooling/moon/bin/moon' }
          & $moon build --target native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/provider-consumer/build_candidates.py output/provider-fixtures
      - name: Install fixed host
        shell: pwsh
        run: |
          if ($IsWindows) {
            Invoke-WebRequest https://update.code.visualstudio.com/1.144.0/win32-x64-archive/stable -OutFile code.zip
            Expand-Archive code.zip code
          } else {
            curl -fLsS https://update.code.visualstudio.com/1.144.0/linux-x64/stable -o code.tar.gz
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            New-Item -ItemType Directory code
            tar xzf code.tar.gz --strip-components=1 -C code
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Allow the fixed Linux host to create its Electron sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ ! -r "$restriction" || "$(cat "$restriction")" != 1 ]]; then
            echo "AppArmor user namespace restriction is inactive"
            exit 0
          fi

          # Keep the runner-wide restriction and Electron sandbox enabled.
          # Attach the exception to the exact executable the test runner starts.
          desktop="$(realpath -e code/code)"
          if [[ "$desktop" != "$GITHUB_WORKSPACE/code/code" ||
                ! "$desktop" =~ ^/[A-Za-z0-9_./-]+$ || ! -x "$desktop" ]]; then
            echo "::error::Unexpected VS Code archive path"
            exit 1
          fi
          profile="$(mktemp "$RUNNER_TEMP/edittrace-code.XXXXXX")"
          cat > "$profile" <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile edittrace-vscode-ci "$desktop" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r "$profile"
          echo "Loaded VS Code AppArmor profile for the test executable"
      - name: Start a shared X display for the Linux host tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Use one authenticated display for the job so cleanup cannot replace
          # the exit code of an individual provider check.
          auth=$(mktemp "$RUNNER_TEMP/edittrace-xauth.XXXXXX")
          ready=$(mktemp "$RUNNER_TEMP/edittrace-display.XXXXXX")
          log="$RUNNER_TEMP/edittrace-xvfb.log"
          xauth -f "$auth" add :99 MIT-MAGIC-COOKIE-1 "$(mcookie)"
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp -auth "$auth" -displayfd 3 \
            3>"$ready" >"$log" 2>&1 </dev/null &
          server=$!
          for attempt in {1..100}; do
            if [[ -s "$ready" ]] && kill -0 "$server" 2>/dev/null; then
              printf 'DISPLAY=:99\nXAUTHORITY=%s\n' "$auth" >> "$GITHUB_ENV"
              exit 0
            fi
            if ! kill -0 "$server" 2>/dev/null; then break; fi
            sleep 0.1
          done
          cat "$log"
          echo '::error::Xvfb did not start for host validation'
          exit 1
      - name: Assert good, faulty and fixed provider behavior
        shell: pwsh
        run: |
          if (!$IsWindows) {
            id -u
            ldd code/code
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $digests = Get-Content output/provider-fixtures/SHA256.json -Raw | ConvertFrom-Json
          $core = python -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from native_artifact import find_native_executable; print(find_native_executable(Path.cwd()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $code = if ($IsWindows) { 'code/bin/code.cmd' } else { 'code/bin/code' }
          python scripts/check_provider_evidence.py $core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $core case run examples/provider-consumer/frozen-rename.case.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($version in '1.0.0', '1.1.0', '1.1.1') {
            $asset = "versioned-provider-$version.vsix"
            $arguments = @('scripts/run_provider_regression.py', 'examples/provider-consumer/suite.json', '--candidate', "output/provider-fixtures/$asset", '--sha256', $digests.$asset, '--core', $core, '--host', '1.144.0', '--code', (Resolve-Path $code).Path, '--out', "output/provider-$version")
            python @arguments
            $expected = if ($version -eq '1.1.0') { 1 } else { 0 }
            if ($LASTEXITCODE -ne $expected) { throw "Unexpected provider result for $version" }
            $report = Get-Content "output/provider-$version/summary.json" -Raw | ConvertFrom-Json
            if ($report.scenarios.Count -ne 3 -or @($report.scenarios | Where-Object exit_code -ne $expected).Count) {
              throw "Unexpected per-scenario result for $version"
            }
            $expectedNames = @('client-sync', 'cross-file-rename', 'format')
            if (Compare-Object $expectedNames @($report.scenarios.name | Sort-Object)) {
              throw "Unexpected scenario identities for $version"
            }
            if ($version -eq '1.1.0') {
              $rename = $report.scenarios | Where-Object name -eq 'cross-file-rename'
              if ($rename.stage -ne 'complete' -or -not @($rename.failures | Where-Object {
                $_.path -eq 'reference.etrf' -and $_.reason -eq 'reviewed text mismatch'
              }).Count) { throw 'Faulty provider did not report the missing reference edit' }
            }
          }
          foreach ($version in '1.2.0', '1.3.0') {
            $asset = "versioned-provider-$version.vsix"
            $arguments = @('scripts/run_provider_regression.py', 'examples/provider-consumer/suite.json', '--candidate', "output/provider-fixtures/$asset", '--sha256', $digests.$asset, '--core', $core, '--host', '1.144.0', '--code', (Resolve-Path $code).Path, '--out', "output/provider-$version")
            python @arguments
            if ($LASTEXITCODE -ne 2) { throw "Incomplete run must return 2 for $version" }
            $report = Get-Content "output/provider-$version/summary.json" -Raw | ConvertFrom-Json
            $format = $report.scenarios | Where-Object name -eq 'format'
            $reason = if ($version -eq '1.2.0') { 'provider response unavailable' } else { 'provider request timed out' }
            if ($format.exit_code -ne 2 -or $format.stage -ne 'provider_request' -or $format.failures[0].reason -ne $reason) {
              throw "Unexpected format diagnostic for $version"
            }
            if ($report.scenarios.Count -ne 3 -or @($report.scenarios | Where-Object {
              $_.name -in @('cross-file-rename', 'client-sync') -and $_.exit_code -eq 0
            }).Count -ne 2) { throw "Unexpected unaffected scenarios for $version" }
          }
          foreach ($version in '1.0.0', '1.4.0') {
            $asset = "versioned-provider-$version.vsix"
            $arguments = @('scripts/run_provider_regression.py', 'examples/provider-consumer/candidate-format-suite.json', '--candidate', "output/provider-fixtures/$asset", '--sha256', $digests.$asset, '--core', $core, '--host', '1.144.0', '--code', (Resolve-Path $code).Path, '--out', "output/provider-bound-$version")
            python @arguments
            $expected = if ($version -eq '1.4.0') { 2 } else { 0 }
            if ($LASTEXITCODE -ne $expected) { throw "Unexpected candidate API result for $version" }
            $report = Get-Content "output/provider-bound-$version/summary.json" -Raw | ConvertFrom-Json
            if ($report.scenarios.Count -ne 1 -or $report.scenarios[0].invocation -ne 'candidate_api_v1' -or
                ($expected -eq 2 -and $report.scenarios[0].failures[0].reason -ne 'candidate provider API unavailable')) {
              throw "Unexpected candidate API diagnostic for $version"
            }
          }
          $asset = 'versioned-provider-1.0.0.vsix'
          $scopeArguments = @('scripts/run_provider_regression.py', 'examples/provider-consumer/sync-scope-suite.json', '--candidate', "output/provider-fixtures/$asset", '--sha256', $digests.$asset, '--core', $core, '--host', '1.144.0', '--code', (Resolve-Path $code).Path, '--out', 'output/provider-sync-scope')
          python @scopeArguments
          if ($LASTEXITCODE -ne 1) { throw 'The scope suite must report behavioral regressions' }
          $scope = Get-Content output/provider-sync-scope/summary.json -Raw | ConvertFrom-Json
          $reasons = @{
            'outside-file' = 'sync edit outside declared files'
            'outside-untitled' = 'sync edit outside declared files'
            'outside-undo' = 'sync edit outside declared files'
            'frozen-undo' = 'sync edit to a file expected to stay unchanged'
          }
          if ($scope.scenarios.Count -ne 5 -or @($scope.scenarios | Where-Object {
            if ($_.name -eq 'background-open') { $_.exit_code -ne 0 }
            else { !$reasons.ContainsKey($_.name) -or $_.exit_code -ne 1 -or
              $_.failures[0].reason -ne $reasons[$_.name] -or $_.failures[0].seq -le 0 }
          }).Count) { throw 'Unexpected per-scenario sync scope outcome' }
          # The final suite intentionally returned 1 and its evidence was checked.
          exit 0
      - name: Verify pinned TypeScript language service in a separate workspace
        shell: pwsh
        run: |
          $assets = 'output/typescript-consumer'
          New-Item -ItemType Directory $assets | Out-Null
          $core = python -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from native_artifact import find_native_executable; print(find_native_executable(Path.cwd()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $code = if ($IsWindows) { 'code/bin/code.cmd' } else { 'code/bin/code' }
          $lock = Get-Content examples/provider-consumer/typescript-lock.json -Raw | ConvertFrom-Json
          foreach ($version in '5.6.3', '5.7.3') {
            curl -fsSL $lock.$version.url -o "$assets/$version.tgz"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($name in 'prior', 'synthetic-omission', 'current') {
            $version = if ($name -eq 'prior') { '5.6.3' } else { '5.7.3' }
            $candidateDir = "$assets/$name"
            $build = @('examples/provider-consumer/build_typescript_candidate.py', $version, "$assets/$version.tgz", $candidateDir)
            if ($name -eq 'synthetic-omission') { $build += '--synthetic-omit-reference' }
            python @build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $receipt = Get-Content "$candidateDir/receipt.json" -Raw | ConvertFrom-Json
            $env:EDITTRACE_TYPESCRIPT_JS = (Resolve-Path "$candidateDir/typescript.js").Path
            $out = "output/provider-typescript-$name"
            $arguments = @('scripts/run_provider_regression.py', 'examples/provider-consumer/typescript-rename-suite.json', '--candidate', "$candidateDir/typescript-rename.vsix", '--sha256', $receipt.candidate_sha256, '--core', $core, '--code', (Resolve-Path $code).Path, '--host', '1.144.0', '--out', $out)
            python @arguments
            $expected = if ($name -eq 'synthetic-omission') { 1 } else { 0 }
            if ($LASTEXITCODE -ne $expected) { throw "Unexpected TypeScript result for $name" }
            if ($expected -eq 1) {
              $failure = (Get-Content "$out/summary.json" -Raw | ConvertFrom-Json).scenarios[0].failures[0]
              if ($failure.path -ne 'client.ts' -or $failure.first_difference_utf16 -ne 9) { throw 'Wrong TypeScript mismatch' }
            }
          }
          # The self-test has checked expected failures. The consumer workflow propagates them.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-${{ matrix.os }}
          path: |
            output/provider-*/summary.json
            output/provider-*/junit.xml
